packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  esbuild: true
catalog:
  react: ^19
  react-dom: ^19
  tailwindcss: ^4.3.3
  "@tailwindcss/postcss": ^4
  typescript: ^5.9.3
permissions:
  '@trigger.dev/sdk':
    skills: [trigger-authoring-chat-agent, trigger-authoring-tasks, trigger-chat-agent-advanced, trigger-cost-savings, trigger-realtime-and-frontend]
  drizzle-kit:
    skills: true
  ngrok:
    build: false
  protobufjs:
    build: false
